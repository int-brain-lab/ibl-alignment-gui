name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run Qt without a display server.
  QT_QPA_PLATFORM: offscreen
  # test_predict_cumulative is excluded until its features fixture includes the columns the
  # 2026_W39 ProbeTransformer needs; without them the prediction opens an error dialog, which
  # aborts the test process. (It is also skipped here, as CI does not install ephysatlas/torch.)
  PYTEST_DESELECT: >-
    --deselect tests/plugins/test_region_decoders.py::TestRegionDecoders::test_predict_cumulative

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: check lockfile is up to date
        run: uv lock --check
      - name: sync dependencies
        run: uv sync --locked --only-group lint
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github
      - name: ruff format
        run: uv run --no-sync ruff format --check --diff

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: sync dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: run tests
        shell: bash
        run: uv run --no-sync pytest --cov --cov-report=term $PYTEST_DESELECT

  test-ibl:
    # The IBL online mode (ONE/Alyx upload, raw-data streaming) is tested against ibllib, which
    # is an optional extra; without it these tests are skipped in the job above.
    name: Test with IBL extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: sync dependencies
        run: uv sync --locked --no-default-groups --group test --extra ibl
      - name: run tests
        run: uv run --no-sync pytest --cov --cov-report=term $PYTEST_DESELECT
